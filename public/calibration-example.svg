<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360">
  <!-- 校准示例图：示意 6 区域在游戏画面中的大致位置（仅作框选示意，非真实游戏素材） -->
  <rect width="640" height="360" fill="#1f2937"/>
  <rect x="16" y="16" width="608" height="328" rx="8" fill="#111827" stroke="#374151"/>
  <text x="320" y="180" text-anchor="middle" fill="#6b7280"
        font-family="sans-serif" font-size="20">校准示意：经验条 / 经验数值 / 等级 / 金币 / HP / MP</text>

  <!-- 底部区域示意 -->
  <rect x="40" y="300" width="220" height="24" fill="#374151" stroke="#f59e0b" stroke-width="2"/>
  <text x="150" y="316" text-anchor="middle" fill="#fcd34d" font-family="sans-serif" font-size="12">expBar / expText</text>

  <rect x="280" y="300" width="70" height="24" fill="#374151" stroke="#60a5fa" stroke-width="2"/>
  <text x="315" y="316" text-anchor="middle" fill="#93c5fd" font-family="sans-serif" font-size="11">level</text>

  <rect x="370" y="300" width="140" height="24" fill="#374151" stroke="#facc15" stroke-width="2"/>
  <text x="440" y="316" text-anchor="middle" fill="#fde68a" font-family="sans-serif" font-size="11">gold</text>

  <rect x="530" y="300" width="70" height="24" fill="#374151" stroke="#34d399" stroke-width="2" stroke-dasharray="4 3"/>
  <text x="565" y="316" text-anchor="middle" fill="#6ee7b7" font-family="sans-serif" font-size="11">hp/mp</text>
</svg>
